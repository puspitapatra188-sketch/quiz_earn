.optg{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:360px;margin:0 auto;width:100%}
.optn{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:14px;font-size:20px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}

@keyframes pop{0%{transform:scale(.3) rotate(-15deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}

.balcard,.hero{position:relative;overflow:hidden}
.balcard::after,.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,224,138,.10) 50%,transparent 65%);background-size:200% 100%;animation:shine 6s linear infinite}
.page{animation:fadein .25s ease-out}

.btn.red{background:var(--tint);color:var(--brand);border:1px solid var(--gold-line)}

.appc{text-align:left;width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

var ADMOB_REWARDED_ID="ca-app-pub-3940256099942544/5224354917";
var ADMOB_TESTING=true; // set to false in your release build
function nativeAds(){try{return !!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&Capacitor.Plugins&&Capacitor.Plugins.AdMob)}catch(e){return false}}
function initAds(){if(!nativeAds())return;try{Capacitor.Plugins.AdMob.initialize({initializeForTesting:ADMOB_TESTING}).catch(function(){})}catch(e){}}
var adBusy=false;
function nativeAd(done){
  if(adBusy)return;adBusy=true;
  var AM=Capacitor.Plugins.AdMob,rewarded=false,hs=[];
  function end(){adBusy=false;hs.forEach(function(h){try{h.remove()}catch(e){}});hs=[]}
  Promise.all([
    AM.addListener("onRewardedVideoAdReward",function(){rewarded=true}),
    AM.addListener("onRewardedVideoAdDismissed",function(){end();if(rewarded){day().ads++;save();done()}else toast("Ad skipped. No reward.")}),
    AM.addListener("onRewardedVideoAdFailedToShow",function(){end();toast("Ad could not play. Try again.")})
  ]).then(function(h){hs=h;return AM.prepareRewardVideoAd({adId:ADMOB_REWARDED_ID,isTesting:ADMOB_TESTING})})
    .then(function(){return AM.showRewardVideoAd()})
    .catch(function(){end();toast("No ad available right now. Try again in a minute.")});
}

/* ---------- Quiz ---------- */
function qStart(mode){
  var src=mode==="ff"?FFQ:QS;
  var pool=src.slice().sort(function(){return Math.random()-.5}).slice(0,mode==="ff"?FFQ.length:Q_LEN);
  Q={mode:mode==="ff"?"ff":"bb",n:pool.length,cleared:0,wrong:0,list:pool,i:0,correct:0,locked:false,sel:-1,left:Q_TIME,done:false,reward:0,note:""};
  sub="quiz";runTimer();render();window.scrollTo(0,0);
}
function runTimer(){
  stopTimer();
  timer=setInterval(function(){
    if(!Q||Q.locked||Q.done){stopTimer();return}
    Q.left-=0.1;
    var tb=document.getElementById("tb"),tl=document.getElementById("tl");
    if(tb){tb.style.width=Math.max(0,Q.left/Q_TIME*100)+"%";if(Q.left<5)tb.parentNode.classList.add("warn")}
    if(tl)tl.textContent=Math.max(0,Math.ceil(Q.left))+"s";
    if(Q.left<=0)answer(-1);
  },100);
}
function answer(k){
  if(!Q||Q.locked)return;
  Q.locked=true;Q.sel=k;stopTimer();S.played++;
  if(k===Q.list[Q.i][2]){Q.correct++;Q.cleared++;S.correct++}
  else if(Q.mode==="ff"){Q.wrong++;Q.list.push(Q.list[Q.i])} // wrong or timed out: this question must be answered again
  save();render();
}
function qNext(){
  if(Q.mode==="ff"){
    // one ad after every Free Fire question; the quiz only moves on after the ad is finished
    var last=Q.i+1>=Q.list.length;
    showAd("Free Fire quiz · "+Q.cleared+" of "+Q.n+" cleared",last?"See result":"Next question",qAdvance);
    return;
  }
  qAdvance();
}
function qAdvance(){
  if(Q.i+1<Q.list.length){Q.i++;Q.locked=false;Q.sel=-1;Q.left=Q_TIME;runTimer();render()}
  else{
    Q.done=true;stopTimer();
    if(Q.mode==="ff"){
      // reward for completing all questions, once per account
      if(!S.ff){S.ff=true;Q.reward=FF_COINS;add(FF_COINS,"Free Fire Quiz completed ("+Q.wrong+" retries)")}
      else{save();Q.note="You already collected the Free Fire reward. Playing again earns no more coins."}
    }else{
      var base=Q.correct*Q_COINS+(Q.correct===Q.n?Q_PERFECT:0),d=day();
      d.rounds++;if(Q.correct===Q.n)d.perfect=true;Q.reward=base;
      if(base>0)add(base,"Brain Buster "+Q.correct+"/"+Q.n);else save();
    }
    render();
  }
}
function brain(){showAd("Brain Buster","Start playing",function(){qStart("bb")})}

/* ---------- Offers ---------- */
function dailyWin(){
  var d=day();
  if(d.win){toast("Already claimed. Come back tomorrow.");return}
  var c=DAILY_WIN;d.win=true;add(c,"Daily Win");render();toast("Daily Win: +"+c+" coins");
}
function genNum(){return String(1000+Math.floor(Math.random()*9000))}
function similar(n){
  var a=n.split(""),i=Math.floor(Math.random()*4),j=(i+1+Math.floor(Math.random()*3))%4;
  if(Math.random()<.4){var x=a[i];a[i]=a[j];a[j]=x}else{a[i]=String((+a[i]+1+Math.floor(Math.random()*9))%10)}
  if(a[0]==="0")a[0]="1";
  return a.join("");
}
function newCap(){
  var n=genNum(),opts=[n],guard=0;
  while(opts.length<4&&guard++<60){var s=similar(n);if(opts.indexOf(s)<0)opts.push(s)}
  while(opts.length<4){var r=genNum();if(opts.indexOf(r)<0)opts.push(r)}
  opts.sort(function(){return Math.random()-.5});
  var dots=[];for(var k=0;k<8;k++)dots.push([Math.round(Math.random()*88),Math.round(Math.random()*88)]);
  C.num=n;C.opts=opts;C.dots=dots;
}
function offerStart(k){C={offer:k,stage:"play",ok:0,tries:CAP_TRIES};newCap();sub="cap";render();window.scrollTo(0,0)}
function capPick(i){
  if(!C||C.stage!=="play")return;
  if(C.opts[i]===C.num){
    C.ok++;
    if(C.ok>=CAP_NEED)C.stage="won";else newCap();
    render();
  }else{
    C.tries--;
    if(C.tries<=0)C.stage="fail";
    else{toast("Wrong number. "+C.tries+" attempt"+(C.tries>1?"s":"")+" left");newCap()}
    render();
  }
}
function collectGem(){
  var n=2+Math.floor(Math.random()*2),o=C.offer;
  (function step(i){
    showAd("Gem ad "+i+" of "+n,i<n?"Next ad":"Collect gem",function(){
      if(i<n){step(i+1);return}
      S.gems[o]++;save();
      if(S.gems[o]>=GEMS_NEEDED){
        S.gems[o]=0;newApp(o);C.stage="done";
      }else{C.stage="play";C.ok=0;C.tries=CAP_TRIES;newCap();toast("+1 gem collected")}
      render();
    });
  })(1);
}

  else if(a==="info"){INFO=k;renderInfo()}
  else if(a==="infoclose"||a==="infobg"){INFO=null;renderInfo()}
  else if(a==="cap")capPick(+k);
  else if(a==="collect")collectGem();
  else if(a==="capretry"){C.stage="play";C.ok=0;C.tries=CAP_TRIES;newCap();render()}
  else if(a==="ans")answer(+k);
  else if(a==="qnext")qNext();
  else if(a==="qagain")brain();
  else if(a==="adclaim")showAd.close(true);
  else if(a==="adclose")showAd.close(false);
  else if(a==="refresh"){render();toast("Balance updated")}
  else if(a==="country")toast("Only India is supported for now");
  else if(a==="method"){R={k:k,mult:1,f:{},err:"",done:null,amt:0};if(MAP[k].kind==="email"){sub="gift";R.amt=GIFTS[0];render();window.scrollTo(0,0)}else renderSheet()}
  else if(a==="giftamt"){R.amt=+k;R.err="";render()}
  else if(a==="giftdone"){R.k=null;R.done=null;sub=null;render()}
  else if(a==="tier"){R.mult=+k;R.err="";renderSheet()}
  else if(a==="wdsubmit")wdSubmit();
  else if(a==="sheetclose"||a==="sheetbg"){R.k=null;R.done=null;renderSheet()}
  else if(a==="claimtask"){
    var t=tasksList().filter(function(x){return x.id===k})[0],d=day();
    if(t&&t.p>=t.g&&!d.claimed[k]){d.claimed[k]=true;add(t.r,"Task: "+t.t);render();toast("+"+t.r+" coins")}
  }
  else if(a==="savename"){var n=(PF.name||"").trim();if(!n){toast("Enter a name");return}S.name=n.slice(0,16);PF.name=S.name;save();render();toast("Name saved")}
  else if(a==="resetask"){PF.confirm=true;render()}
  else if(a==="resetno"){PF.confirm=false;render()}
  else if(a==="resetyes"){S=fresh();save();PF={name:S.name,confirm:false};R={k:null,mult:1,f:{},err:"",done:null};render();toast("Demo data reset")}
  else if(a==="copyref"){
    var fb=function(){var n=document.getElementById("rcode"),r=document.createRange();r.selectNodeContents(n);var s=getSelection();s.removeAllRanges();s.addRange(r);toast("Code selected, copy it")};
    try{navigator.clipboard.writeText(S.ref).then(function(){toast("Code copied")},fb)}catch(x){fb()}
  }
});
document.addEventListener("input",function(e){
  var id=e.target.id,v=e.target.value;if(!id)return;
  if(id.indexOf("f-")===0){
    if(id==="f-acc"||id==="f-pid")v=v.replace(/\D/g,"");
    if(id==="f-ifsc")v=v.toUpperCase();
    e.target.value=v;R.f[id]=v;
  }else if(id==="p-name")PF.name=v;
});
initAds();
try{
  var CA=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;
  if(CA&&CA.addListener){
    NATIVE_BACK=true;
    CA.addListener("backButton",function(){
      if(deep()){goBack();render();window.scrollTo(0,0)}
      else if(CA.exitApp)CA.exitApp();
    });
  }
}catch(e){}
render();
})();
</script>
</body>
</html>
